project:
  type: book
  output-dir: _book
  pre-render: scripts/pre-render.sh
  render:
    - index.qmd
    - chapters/*.qmd
    - templates/index.qmd
    - policies/*.qmd
    - forms/index.qmd
  resources:
    - templates/pdf/
    - forms/pdf/
    - assets/brand/
    - assets/fonts/

book:
  title: "RIPLRT Institute Research Group Manual"
  subtitle: "A Guide for Environmental Immunology, Respiratory Health Equity, Computational Discovery, and Inclusive Mentoring"
  author: "The RIPLRT Institute"
  date: "2026-06-01"
  edition: "2026 Edition (v2.0)"
  description: >
    The operating system of the RIPLRT Institute: a mentee-powered environmental
    immunology and respiratory health equity research group translating environmental
    exposures into equitable respiratory and immune health.
  site-url: https://manual.riplrt.com
  favicon: assets/brand/favicon.png
  image: https://manual.riplrt.com/assets/brand/og-image.jpg
  open-graph:
    site-name: "RIPLRT Institute Research Group Manual"
    locale: en_US
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: assets/brand/riplrt-mark.png
    logo-alt: "RIPLRT Institute"
    title: "RIPLRT Institute Manual"
    pinned: true
    right:
      - text: "riplrt.com"
        href: https://riplrt.com
  sidebar:
    style: docked
    collapse-level: 1
    title: false
  sharing: [twitter, linkedin]
  search: true
  page-footer:
    left: "© 2026 RIPLRT Institute · Felix E. Rivera-Mariani PhD LLC"
    center: "2026 Edition (v2.0) · [DOI 10.5281/zenodo.21538575](https://doi.org/10.5281/zenodo.21538575) · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    right: "Updated {{< var build.date >}} · [riplrt.com](https://riplrt.com)"
  chapters:
    - index.qmd
    - part: "Identity & Belonging"
      chapters:
        - chapters/01-welcome.qmd
        - chapters/02-history-evolution.qmd
        - chapters/03-scientific-identity.qmd
        - chapters/04-vision-mission-values.qmd
        - chapters/05-belonging.qmd
    - part: "People & Structure"
      chapters:
        - chapters/06-roles-pods.qmd
        - chapters/07-inclusive-mentoring.qmd
        - chapters/08-culture-psych-safety.qmd
        - chapters/09-communication-digital-body-language.qmd
    - part: "How We Work"
      chapters:
        - chapters/10-project-management.qmd
        - chapters/11-data-governance.qmd
        - chapters/12-reproducible-open-science.qmd
        - chapters/13-responsible-ai.qmd
    - part: "Scholarship & Dissemination"
      chapters:
        - chapters/14-authorship-dissemination.qmd
        - chapters/15-research-products.qmd
    - part: "Operations & Care"
      chapters:
        - chapters/16-health-safety-fieldwork.qmd
        - chapters/17-conflict-feedback-accountability.qmd
        - chapters/18-funding-travel-development.qmd
    - part: "Lifecycle & Maintenance"
      chapters:
        - chapters/19-onboarding-offboarding.qmd
        - chapters/20-annual-review.qmd
    - chapters/21-appendices.qmd
  appendices:
    - templates/index.qmd
    - policies/index.qmd
    - policies/authorship-contributorship.qmd
    - policies/data-governance.qmd
    - policies/responsible-ai-use.qmd
    - policies/code-of-conduct.qmd
    - forms/index.qmd

bibliography: references.bib
csl: https://www.zotero.org/styles/apa

lang: en

format:
  html:
    theme:
      light: [cosmo, assets/riplrt.scss]
      dark: [darkly, assets/riplrt.scss, assets/riplrt-dark.scss]
    css: assets/fonts/fonts.css
    mermaid-format: svg
    filters: [assets/html/mermaid-svg.lua]
    back-to-top-navigation: true
    toc: true
    toc-depth: 3
    number-sections: true
    code-link: true
    link-external-newwindow: true
    include-in-header:
      - assets/head.html
      - assets/amplitude.html

execute:
  freeze: auto
  echo: false
  warning: false
